<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">STW FPV drone module dependencies</title><desc id="desc">Standalone FPV drone core with Special Forces, DAC surveillance and environment adapters.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker><style>text{font:700 18px Arial;fill:#172033;text-anchor:middle}.core{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.bridge{fill:#fef3c7;stroke:#d97706;stroke-width:2}.optional{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.e{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="430" fill="#fff"/><text x="550" y="38" style="font-size:26px">STW FPV drone modules</text><rect x="410" y="70" width="280" height="65" rx="12" class="core"/><text x="550" y="109">STWFPVDrone</text><rect x="70" y="230" width="250" height="65" rx="12" class="optional"/><text x="195" y="269">STWSpecialForces</text><rect x="425" y="190" width="250" height="85" rx="12" class="bridge"/><text x="550" y="225">STWFPVDroneDACAdapter</text><text x="550" y="251" style="font-size:14px">detections → DAC surveillance</text><rect x="780" y="190" width="250" height="85" rx="12" class="bridge"/><text x="905" y="225">STWFPVDroneEnvironmentAdapter</text><text x="905" y="251" style="font-size:14px">forest/building avoidance</text><path d="M470 135 250 230 M550 135v55 M630 135 850 190" class="e"/><text x="550" y="350" style="font-size:15px;font-weight:400">DAC adapter depends on STWDivideAndConquer, STWDACSurveillanceBridge and STWCombatKnowledge.</text><text x="550" y="380" style="font-size:15px;font-weight:400">Environment adapter depends on STWDivideAndConquer and STWBuildingKnowledge.</text></svg>
