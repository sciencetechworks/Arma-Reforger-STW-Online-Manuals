<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">STW Combat Zone and optional integrations</title>
<desc id="desc">STWCombatZone provides Combat Zone support and STWCombatZoneCKnowledgeAdapter adds that capability to STWCombatKnowledge.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker><style>text{font:700 18px Arial;fill:#172033;text-anchor:middle}.core{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.bridge{fill:#fef3c7;stroke:#d97706;stroke-width:2}.e{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.small{font:14px Arial;fill:#172033;text-anchor:middle}</style></defs>
<rect width="1100" height="360" fill="#fff"/><text x="550" y="38" style="font-size:26px">STW Combat Zone integration</text>
<rect x="70" y="125" width="260" height="70" rx="12" class="core"/><text x="200" y="167">STWCombatKnowledge</text>
<rect x="420" y="125" width="300" height="70" rx="12" class="bridge"/><text x="570" y="153">STWCombatZoneCKnowledgeAdapter</text><text x="570" y="178" class="small">adds Combat Zone capability</text>
<rect x="810" y="125" width="220" height="70" rx="12" class="core"/><text x="920" y="167">STWCombatZone</text>
<path d="M330 160H420 M720 160H810" class="e"/>
<text x="550" y="260" class="small">The adapter connects Combat Knowledge perception and support dispatch</text><text x="550" y="286" class="small">to the independent Combat Zone provider.</text>
</svg>
