<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">STW optional integrations and bridge mods</title>
  <desc id="desc">Optional STW integrations and bridge mods used to connect Bases, Crates, Heavy Weapons or a compatible surveillance provider to Divide and Conquer or Stronghold.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.core{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.optional{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.bridge{fill:#fef3c7;stroke:#d97706;stroke-width:2}.edge{stroke:#64748b;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}.label{font-size:18px;font-weight:700;text-anchor:middle}.small{font-size:15px;text-anchor:middle}.title{font-size:27px;font-weight:700;text-anchor:middle}</style></defs>
  <rect width="1200" height="760" fill="#fff"/><text x="600" y="42" class="title">STW optional integrations and bridge mods</text><text x="600" y="70" class="small">Dashed arrows mean optional. Core projects continue to run without these integrations.</text>
  <rect x="60" y="145" width="240" height="70" rx="12" class="optional"/><text x="180" y="187" class="label">STWSnipers</text><rect x="60" y="255" width="240" height="70" rx="12" class="optional"/><text x="180" y="297" class="label">STWAntiAirTeam</text><rect x="60" y="405" width="240" height="70" rx="12" class="optional"/><text x="180" y="447" class="label">STWMinefields</text><rect x="60" y="515" width="240" height="70" rx="12" class="optional"/><text x="180" y="557" class="label">STWHeavyWeapons</text>
  <rect x="480" y="145" width="240" height="70" rx="12" class="core"/><text x="600" y="187" class="label">STWCombatKnowledge</text><rect x="480" y="405" width="240" height="70" rx="12" class="core"/><text x="600" y="447" class="label">STWStronghold</text><rect x="900" y="275" width="240" height="70" rx="12" class="core"/><text x="1020" y="317" class="label">STWDivideAndConquer</text><rect x="420" y="255" width="300" height="70" rx="12" class="bridge"/><text x="570" y="285" class="label">STWBasesDACIntegration</text><text x="570" y="307" class="small">Optional Bases ↔ DAC adapter</text><rect x="420" y="345" width="240" height="70" rx="12" class="core"/><text x="540" y="387" class="label">STWBasesGenerator</text><rect x="60" y="625" width="240" height="70" rx="12" class="optional"/><text x="180" y="667" class="label">STWCrates</text>
  <path d="M300 180 C370 180 410 180 480 180 M300 290 C380 220 410 205 480 195 M300 440 C380 440 410 440 480 440 M300 550 C590 550 700 350 900 320 M300 180 C560 100 730 180 900 290 M300 290 C550 330 700 335 900 320 M300 440 C560 420 700 360 900 320 M720 290 C790 280 840 300 900 320 M720 380 C800 360 850 340 900 320 M300 660 C360 620 390 560 420 380" class="edge"/>
  <rect x="820" y="460" width="320" height="60" rx="10" class="bridge"/><text x="980" y="487" class="label" font-size="16">STWDACHeavyWeaponBridge</text><text x="980" y="507" class="small">Use only for DAC ↔ Heavy Weapons</text><rect x="820" y="545" width="320" height="60" rx="10" class="bridge"/><text x="980" y="572" class="label" font-size="16">STWDACSurveillanceBridge</text><text x="980" y="592" class="small">Use only for DAC ↔ surveillance</text><rect x="420" y="570" width="320" height="60" rx="10" class="bridge"/><text x="580" y="597" class="label" font-size="16">STWStrongholdHWeaponsBridge</text><text x="580" y="617" class="small">Use only for Stronghold ↔ Heavy Weapons</text><path d="M1020 345 L980 460 M1020 345 L980 545 M600 475 L580 570" class="edge"/>
  <rect x="60" y="700" width="18" height="18" class="optional"/><text x="88" y="715" class="small" text-anchor="start">Optional project</text><rect x="265" y="700" width="18" height="18" class="core"/><text x="293" y="715" class="small" text-anchor="start">Core project</text><rect x="455" y="700" width="18" height="18" class="bridge"/><text x="483" y="715" class="small" text-anchor="start">Bridge mod</text>
</svg>
